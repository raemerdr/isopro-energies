<style>
  :root { --bg:#f4f3ef; --ink:#172124; --muted:#5d6b6c; --line:#d8d6cf; --teal:#2e5e61; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, -apple-system, sans-serif; }
  header, main { max-width:1400px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:8px 0 4px; }
  header p { margin:0; color:var(--muted); max-width:70em; }
  main { display:grid; grid-template-columns:repeat(auto-fill, minmax(420px, 1fr)); gap:16px; }
  figure { margin:0; background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .crop { aspect-ratio:3.4 / 1; overflow:hidden; }
  .crop img { width:100%; height:100%; object-fit:cover; object-position:50% 45%; filter:grayscale(1) contrast(1.05); display:block; }
  .full { height:120px; background:#e6e4dd; }
  .full img { height:100%; width:auto; display:block; margin:0 auto; }
  figcaption { padding:8px 10px 10px; color:var(--muted); }
  figcaption b { color:var(--teal); margin-right:4px; }
  figcaption small { display:block; margin-top:2px; }
  figure.pick { outline:3px solid var(--teal); outline-offset:-1px; }
</style>
</head>
